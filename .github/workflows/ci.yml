name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check version consistency
        run: node scripts/check-versions.mjs
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [extension, sidecar]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
        working-directory: packages/${{ matrix.package }}
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/${{ matrix.package }}

  unit-tests:
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        package: [extension, sidecar]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
        working-directory: packages/${{ matrix.package }}
      - name: Test
        run: npm test
        working-directory: packages/${{ matrix.package }}

  integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - name: Run integration tests
        run: bash packages/sidecar/test/integration/run.sh

  audit:
    runs-on: ubuntu-latest
    # Report-only: surfaces vulnerable dependencies without blocking the
    # pipeline. Dependabot handles the actual updates.
    continue-on-error: true
    strategy:
      matrix:
        path: ['.', packages/extension, packages/sidecar]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit dependencies (report only)
        run: npm audit
        working-directory: ${{ matrix.path }}

  coverage:
    runs-on: ubuntu-latest
    # Report-only: prints a coverage summary without enforcing thresholds.
    continue-on-error: true
    strategy:
      matrix:
        package: [extension, sidecar]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
        working-directory: packages/${{ matrix.package }}
      - name: Coverage (report only)
        run: npm run test:coverage
        working-directory: packages/${{ matrix.package }}
