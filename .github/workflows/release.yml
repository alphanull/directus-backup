name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Run integration tests
        run: bash test/integration/run.sh

  publish-extension:
    runs-on: ubuntu-latest
    needs: [integration, lint]
    permissions:
      # Job-level permissions REPLACE the workflow-level block (no merge), so
      # contents: read must be repeated here for actions/checkout.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing (requires npm >= 11.5.1, Node 22 bundles 10.x)
        run: npm install -g npm@latest
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify committed dist is up to date
        # The published package and source installs both consume the committed
        # dist/. Fail the release if a rebuild changes it, so stale artifacts
        # (src/ changed without rebuilding dist/) can never be published. Ignore
        # whitespace-only bundle churn from platform/tooling differences.
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            if git diff --quiet --ignore-all-space -- dist; then
              echo "::warning::Build changed dist/ whitespace only; continuing."
              git status --porcelain -- dist
              git --no-pager diff --stat -- dist
              exit 0
            fi
            echo "::error::Committed dist/ is out of date. Run 'npm run build' and commit the result."
            git status --porcelain -- dist
            git --no-pager diff -- dist
            exit 1
          fi
      - name: Publish
        run: npm publish --access public --provenance

  release:
    runs-on: ubuntu-latest
    needs: publish-extension
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --title "v${{ steps.version.outputs.version }}" --generate-notes
