name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SIDECAR_IMAGE: ghcr.io/alphanull/directus-backup

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check version consistency
        run: node scripts/check-versions.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [extension, sidecar]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
        working-directory: packages/${{ matrix.package }}
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/${{ matrix.package }}
      - name: Unit tests
        run: npm test
        working-directory: packages/${{ matrix.package }}

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Run integration tests
        run: bash packages/sidecar/test/integration/run.sh

  publish-extension:
    runs-on: ubuntu-latest
    needs: [integration, version-check, lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm ci
        working-directory: packages/extension
      - name: Build
        run: npm run build
        working-directory: packages/extension
      - name: Verify committed dist is up to date
        # The published package and source installs both consume the committed
        # dist/. Fail the release if a rebuild changes it, so stale artifacts
        # (src/ changed without rebuilding dist/) can never be published.
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::Committed dist/ is out of date. Run 'npm run build' in packages/extension and commit the result."
            git status --porcelain -- dist
            git --no-pager diff -- dist
            exit 1
          fi
        working-directory: packages/extension
      - name: Publish
        run: npm publish --access public
        working-directory: packages/extension
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sidecar:
    runs-on: ubuntu-latest
    needs: [integration, version-check, lint]
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/sidecar/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.SIDECAR_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.SIDECAR_IMAGE }}:latest

  release:
    runs-on: ubuntu-latest
    needs: [publish-extension, publish-sidecar]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --title "v${{ steps.version.outputs.version }}" --generate-notes
