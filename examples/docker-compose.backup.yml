# Example Docker Compose snippet for the Directus Backup sidecar.
# Merge into your existing docker-compose.yml or use as a reference.
#
# Copy .env.example to .env and fill in the values (BACKUP_SECRET, BACKUP_TOKEN,
# ADMIN_EMAIL, DB_*). See the "add-on" section of .env.example.

services:
  backup:
    image: ghcr.io/alphanull/directus-backup:latest
    restart: unless-stopped
    volumes:
      - ./backups:/directus/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    environment:
      BACKUP_SECRET: ${BACKUP_SECRET}
      BACKUP_TOKEN: ${BACKUP_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      BACKUP_DIR: /directus/backups
      UPLOADS_DIR: /directus/uploads
      EXTENSIONS_DIR: /directus/extensions
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_CONTAINER: ${COMPOSE_PROJECT_NAME}-directus-1
      BACKUP_DUMP_FORMAT: ${BACKUP_DUMP_FORMAT:-custom}
      # Operator kill-switches, secure-by-default OFF. Set to "true" (or "1")
      # to allow importing foreign archives / downloading backups.
      BACKUP_IMPORT_ENABLED: ${BACKUP_IMPORT_ENABLED:-}
      BACKUP_EXPORT_ENABLED: ${BACKUP_EXPORT_ENABLED:-}
      DB_HOST: database
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    depends_on:
      - directus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The backup service must share a Docker network with your Directus service
    # so it can reach http://directus:8055. In a single Compose project the
    # default network already provides this. Only add an explicit `networks:`
    # block here if your stack uses a custom network — and make sure the
    # directus service is attached to that same network.

  # Add these env vars to your existing Directus service:
  # directus:
  #   environment:
  #     BACKUP_URL: http://backup:4700
  #     BACKUP_SECRET: ${BACKUP_SECRET}
