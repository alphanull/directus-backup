# Full standalone example: Directus + PostgreSQL + Backup system.
# No external dependencies — just docker compose up.
#
# 1. Copy .env.example to .env and fill in secrets
# 2. Build the sidecar: docker compose build backup
# 3. Start: docker compose up -d
# 4. Open http://localhost:8055, log in, enable backup module in settings and find "Backup" in the sidebar

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_DATABASE:-directus}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-directus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  directus:
    image: directus/directus:11.17.4
    restart: unless-stopped
    ports:
      - "8055:8055"
    volumes:
      - uploads:/directus/uploads
      - extensions:/directus/extensions
      - backups:/directus/backups
      - ../packages/extension:/directus/extensions/directus-extension-backup:ro
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET required}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      REDIS: redis://cache:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      BACKUP_URL: http://backup:4700
      BACKUP_SECRET: ${BACKUP_SECRET:?BACKUP_SECRET required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8055/server/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  backup:
    build: ../packages/sidecar
    restart: unless-stopped
    volumes:
      - backups:/directus/backups
      - uploads:/directus/uploads
      - extensions:/directus/extensions
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      directus:
        condition: service_healthy
    environment:
      BACKUP_SECRET: ${BACKUP_SECRET:?BACKUP_SECRET required}
      # Optional: static Directus token for version detection + failure
      # notifications. Leave empty to disable both.
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      BACKUP_DIR: /directus/backups
      UPLOADS_DIR: /directus/uploads
      EXTENSIONS_DIR: /directus/extensions
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_CONTAINER: ${COMPOSE_PROJECT_NAME:-examples}-directus-1
      DB_HOST: database
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_DATABASE: ${DB_DATABASE:-directus}
      BACKUP_DUMP_FORMAT: ${BACKUP_DUMP_FORMAT:-custom}
      # Operator kill-switches, secure-by-default OFF. Set to "true" (or "1")
      # to allow importing foreign archives / downloading backups.
      BACKUP_IMPORT_ENABLED: ${BACKUP_IMPORT_ENABLED:-}
      BACKUP_EXPORT_ENABLED: ${BACKUP_EXPORT_ENABLED:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

volumes:
  db_data:
  uploads:
  extensions:
  backups:

networks:
  internal:
